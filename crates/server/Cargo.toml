[package]
name = "localapp-server"
description = "LocalApp web server: a multi-user web app for your home network"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
name = "localapp_server"
path = "src/lib.rs"

[[bin]]
name = "localapp-server"
path = "src/main.rs"

[dependencies]
localapp-core = { path = "../core" }
anyhow.workspace = true
chrono.workspace = true
rusqlite.workspace = true
serde.workspace = true
argon2 = "0.5"
axum = "0.8"
maud = "0.27"
percent-encoding = "2"
rand = "0.8"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "normalize-path", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
serde_html_form = "0.2"
tempfile.workspace = true
